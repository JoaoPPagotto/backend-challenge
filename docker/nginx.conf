# Round-robin load balancer in front of the 3 application instances.
events {}
http {
  upstream wagering {
    server app-1:3000;
    server app-2:3000;
    server app-3:3000;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://wagering;
      proxy_set_header Host $host;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
      proxy_next_upstream error timeout;
    }
  }
}
