name: wagering

x-app: &app
  build: .
  restart: unless-stopped
  stop_grace_period: 30s
  depends_on:
    migrate:
      condition: service_completed_successfully
    init-sqs:
      condition: service_completed_successfully
  environment: &app-env
    NODE_ENV: production
    PORT: "3000"
    LOG_LEVEL: info
    DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    DB_POOL_MAX: "20"
    AWS_REGION: us-east-1
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    # Queue URLs are resolved by name (GetQueueUrl) at startup.
    SQS_MAX_RECEIVE_COUNT: "5"
    SHUTDOWN_TIMEOUT_MS: "25000"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    command: ["postgres", "-c", "max_connections=200"]
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: path
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 3s
      timeout: 5s
      retries: 60

  init-sqs:
    build: .
    command: ["bun", "scripts/init-sqs.ts"]
    restart: "no"
    environment:
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_MAX_RECEIVE_COUNT: "5"
    depends_on:
      localstack:
        condition: service_healthy

  migrate:
    build: .
    command: ["bun", "scripts/migrate.ts", "up"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy

  app-1:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-1 }
    ports: ["3001:3000"]

  app-2:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-2 }
    ports: ["3002:3000"]

  app-3:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-3 }
    ports: ["3003:3000"]

  nginx:
    image: nginx:1.27-alpine
    volumes: ["./docker/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["3000:80"]
    depends_on: [app-1, app-2, app-3]

  # ------------------------------------------------------------------ test infra
  # `bun run infra:up` → real PostgreSQL and LocalStack for integration/concurrency tests.
  postgres-test:
    profiles: [test]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "max_connections=400", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack-test:
    profiles: [test]
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: path
    ports: ["4567:4566"]
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 3s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
